name: Deploy Garments OCR Live

# Same as company-website / ksa-embassy-app / mosla-ghor:
# every push to master deploys to the office server.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Never run two deploys at the same time, and never cancel one half-way
# (a cancelled deploy could stop in the middle of a migration).
concurrency:
  group: garments-ocr-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to live server
    # Office server runner (private IP, GitHub-hosted runners can't reach it)
    runs-on: [self-hosted, garments-ocr-deploy]
    timeout-minutes: 40
    steps:
      # Always run the deploy.sh from the pushed commit, not the older copy
      # sitting on the server, so safety fixes apply on the same deploy.
      - name: Run deployment script
        run: |
          cd /home/hapl/hapl_ocr_3002/garments-ocr
          git fetch origin master
          git show "${GITHUB_SHA}:deploy.sh" > /tmp/garments_ocr_deploy_running.sh
          chmod +x /tmp/garments_ocr_deploy_running.sh
          DEPLOY_SH_COPIED=1 bash /tmp/garments_ocr_deploy_running.sh
